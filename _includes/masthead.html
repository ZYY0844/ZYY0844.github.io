<header class="masthead">
  <div class="masthead__inner-wrap academic-header">
    <a class="academic-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="academic-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
